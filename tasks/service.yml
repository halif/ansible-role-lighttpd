---
- name: Управление состоянием и автозапуском службы через systemd
  ansible.builtin.service:
    name: "{{ lighttpd_service_name }}"
    state: "{{ lighttpd_service_state }}"
    enabled: "{{ lighttpd_service_enabled }}"
  ignore_errors: true

- name: Принудительный запуск lighttpd для окружения Docker (без systemd)
  ansible.builtin.shell: |
    if ! pgrep -x "lighttpd" > /dev/null; then
      lighttpd -f {{ lighttpd_conf_path }}
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Показать лог ошибок lighttpd при сбое запуска
  ansible.builtin.shell: |
    cat /var/log/lighttpd/error.log || cat /var/log/messages | grep lighttpd
  args:
    executable: /bin/bash
  register: error_log
  failed_when: false

- name: Вывод лога на экран
  ansible.builtin.debug:
    msg: "{{ error_log.stdout_lines }}"