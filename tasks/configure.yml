---
- name: Создание корневой директории сайта
  ansible.builtin.file:
    path: "{{ lighttpd_document_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  ignore_errors: true # Игнорируем отсутствие пользователя www-data на RedHat (там обычно lighttpd)

- name: Развертывание конфигурационного файла lighttpd.conf
  ansible.builtin.template:
    src: lighttpd.conf.j2
    dest: "{{ lighttpd_conf_path }}"
    mode: '0644'
  notify: Перезапуск lighttpd
