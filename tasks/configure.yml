---
- name: Создание корневой директории сайта
  ansible.builtin.file:
    path: "{{ lighttpd_document_root }}"
    state: directory
    owner: "{{ lighttpd_user }}"
    group: "{{ lighttpd_group }}"
    mode: '0755'

- name: Развертывание конфигурационного файла lighttpd.conf
  ansible.builtin.template:
    src: lighttpd.conf.j2
    dest: "{{ lighttpd_conf_path }}"
    mode: '0644'
  notify: Перезапуск lighttpd
